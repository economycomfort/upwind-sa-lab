# Requires the AWS Load Balancer Controller and the Gateway API CRDs installed
# on the cluster first (see README.md 'Spin up' section / lab guide Step 2).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: juice-shop-gateway
  namespace: juice-shop
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  gatewayClassName: aws-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
